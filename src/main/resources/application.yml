spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mill_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:${SERVER_PORT:3001}}   # PORT is injected by PaaS hosts such as Railway
  # Honour X-Forwarded-Proto/Host from a proxy (Railway, CloudFront, nginx) so generated URLs (e.g. Swagger) are https://<domain>.
  forward-headers-strategy: framework

app:
  # Business time zone: "today" for date validation (mills are in India; servers usually run in UTC).
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  jwt:
    # No default: set JWT_SECRET (32+ bytes). Without it a random per-run secret is used outside the prod profile.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  sms:
    # "log" = dev mode: OTP SMS text is written to the backend log, nothing is sent.
    # Add an SmsSender implementation for a real provider and set its name here.
    provider: ${SMS_PROVIDER:log}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    resend-cooldown-seconds: 30
    max-attempts: 5
    max-sends-per-hour: 5
    token-validity-minutes: 15
  super-admin:
    # Seeded once on first startup (BCrypt-hashed). Set SUPER_ADMIN_PASSWORD in real deployments.
    password: ${SUPER_ADMIN_PASSWORD:Admin@123}
  dev-admin:
    # Seeded once on first startup (stored BCrypt-hashed, like superadmin). Change it after first login in real deployments.
    username: ${DEV_ADMIN_USERNAME:devadmin}
    password: ${DEV_ADMIN_PASSWORD:DevAdmin@123}
  mill-logo:
    max-bytes: 1048576   # 1 MB
  farmer-photo:
    max-bytes: 2097152   # 2 MB (frontend resizes to ~800px JPEG before upload)

logging:
  level:
    com.millsystem: ${LOG_LEVEL:INFO}
