# =====================================================================
# Production profile (AWS EC2 + RDS MySQL)
# Activate with:  SPRING_PROFILES_ACTIVE=prod
#
# Only overrides are here; everything else comes from application.yml.
# Secrets have NO defaults on purpose: the app refuses to start if one is missing.
# Provide them as environment variables (see deploy/prod.env.example), never commit them.
# =====================================================================

# ---- Server ---------------------------------------------------------
# PaaS hosts (Railway, Render, Heroku...) inject PORT; otherwise SERVER_PORT, else 3001.
server.port=${PORT:${SERVER_PORT:3001}}
# Running behind CloudFront / nginx / a load balancer: trust X-Forwarded-* headers.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.error.include-stacktrace=never
server.error.include-message=never

# ---- RDS MySQL ------------------------------------------------------
# DB_HOST = RDS endpoint, e.g. mill-db.xxxxxxxx.ap-south-1.rds.amazonaws.com
# DB_SSL_MODE (default REQUIRED) encrypts traffic; RDS and the official MySQL image support TLS out of the box.
# Set DB_SSL_MODE=PREFERRED (or DISABLED) for a MySQL host without TLS.
# createDatabaseIfNotExist creates the schema on first start if the RDS instance was made without an initial DB name.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mill_db}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Small pool: db.t4g.micro allows only ~60-80 connections in total.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
# Recycle connections before RDS/network idle timeouts drop them.
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=240000

# ---- JPA ------------------------------------------------------------
# The schema is managed by Hibernate (no Flyway yet): "update" creates missing tables/columns on an
# empty RDS on first start. It never drops data, but cannot change column types - for those, run the
# scripts in db/migrations. Set JPA_DDL_AUTO=validate once the schema is stable.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Security / accounts -------------------------------------------
# JWT_SECRET: at least 32 random characters (e.g. `openssl rand -base64 48`).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Exact frontend origin(s), comma-separated, e.g. https://d1234abcd.cloudfront.net,https://mill.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Initial passwords for the seeded accounts (used only when the account does not exist yet).
app.super-admin.password=${SUPER_ADMIN_PASSWORD}
app.dev-admin.password=${DEV_ADMIN_PASSWORD}

# ---- SMS / OTP ------------------------------------------------------
# WARNING: "log" is the only SMS implementation today - it writes OTP codes to the application log
# and sends nothing. Real farmers cannot receive OTPs until a real SmsSender (e.g. AWS SNS / MSG91)
# is added and selected here.
app.sms.provider=${SMS_PROVIDER:log}

# ---- API docs -------------------------------------------------------
# Swagger UI and the OpenAPI spec are public in dev; switch them off in production.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# ---- Logging --------------------------------------------------------
logging.level.root=WARN
logging.level.com.millsystem=${LOG_LEVEL:INFO}
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Business time zone for date validation.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
