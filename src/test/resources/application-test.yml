# Integration tests run against an in-memory H2 database in MySQL mode — no MySQL server needed.
spring:
  datasource:
    url: jdbc:h2:mem:milltest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  dev-admin:
    password: DevTest@123
  jwt:
    secret: test_only_jwt_secret_key_that_is_definitely_at_least_256_bits_long_0123456789
